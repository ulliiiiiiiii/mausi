# Baut Mausi.exe bei jedem Push und Pull Request.
# Ein Tag wie v1.0.0 erzeugt zusätzlich ein Release mit der fertigen Mausi.exe.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bauen (csc.exe aus .NET Framework 4.8, C# 5)
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: Mausi
          path: Mausi.exe

  # Nur dieser Job darf schreiben, und er läuft nur für Tags.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Mausi

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" Mausi.exe --title "Mausi $GITHUB_REF_NAME" --generate-notes
